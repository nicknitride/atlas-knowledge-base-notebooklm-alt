spring:
  servlet:
    multipart:
      max-file-size: ${ATLAS_MAX_UPLOAD:80MB}
      max-request-size: ${ATLAS_MAX_UPLOAD:80MB}
  application:
    name: atlas-api
  datasource:
    url: ${ATLAS_DATABASE_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${ATLAS_DATABASE_USERNAME:atlas}
    password: ${ATLAS_DATABASE_PASSWORD:atlas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
server:
  error:
    include-message: never
atlas:
  storage-dir: ${ATLAS_STORAGE_DIR:./data/uploads}
  web-origin: ${ATLAS_WEB_ORIGIN:http://localhost:3000}
  max-upload-bytes: ${ATLAS_MAX_UPLOAD_BYTES:83886080}
  ingestion:
    processing-timeout: ${ATLAS_INGESTION_TIMEOUT:10m}
  provider:
    type: ${ATLAS_PROVIDER_TYPE:local}
    ollama:
      url: ${ATLAS_OLLAMA_URL:http://localhost:11434}
      model: ${ATLAS_OLLAMA_MODEL:llama3}
      embedding-model: ${ATLAS_OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      embedding-dimensions: ${ATLAS_OLLAMA_EMBEDDING_DIMENSIONS:768}
    openai:
      api-key: ${ATLAS_OPENAI_API_KEY:}
      model: ${ATLAS_OPENAI_MODEL:gpt-4o-mini}
    gemini:
      api-key: ${ATLAS_GEMINI_API_KEY:}
      model: ${ATLAS_GEMINI_MODEL:gemini-3.5-flash}
